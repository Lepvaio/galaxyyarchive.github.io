  <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Submit APK</title>
</head>

<body>

<a href="index.html">← Home</a>

<h1>Submit APK</h1>

<h2>Use your modern device to be able to submit APK.</h2>

<p>Game Name</p>
<input id="name">

<p>Version</p>
<input id="version">

<p>Download Link</p>
<input id="link">

<p>Notes</p>
<textarea id="note"></textarea>

<br><br>
<div class="cf-turnstile"
data-sitekey="0x4AAAAAAD-KiHEUmm5rOH1F"
data-callback="captchaSuccess">
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>


<button id="submitBtn" disabled>Submit</button>
<script type="module" src="submit.js"></script>
</body>
<p id="status"></p>


<script>
let captchaOK = false;

window.captchaSuccess = function(token){
    captchaOK = true;
    document.getElementById("submitBtn").disabled = false;
  }

document.getElementById("submitBtn").onclick = async function(){

    if(!captchaOK){
        alert("Please complete the CAPTCHA first.");
        return;
    }

    await window.submitAPK();
}
      </script>
</html>
